# Codesearch configuration.
#
# Copy this file to ~/.config/codesearch/config.yaml (or point to it with
# -config or $CODESEARCH_CONFIG), list the folders you want to search,
# then run:
#
#   csindex          # build or incrementally update the index
#   csweb            # serve the web UI (also keeps the index fresh)
#
# Paths may use ~ and $ENV_VARS. Relative paths are relative to this file.

# Where index shards and metadata are stored. Needs roughly 10% of the
# size of the indexed source. Default: codesearch in your user cache
# directory (~/.cache/codesearch on Linux, ~/Library/Caches/codesearch on
# macOS). The CODESEARCH_INDEX_DIR environment variable and the -index_dir
# flag of csweb and csindex override this setting.
index_dir: ~/.cache/codesearch

# Address for csweb. Keep it on localhost unless you want to share
# your code with the network.
listen: localhost:2473

# How often csweb re-scans the repositories and indexes changed files.
# Unchanged repositories cost only a directory scan. 0 disables it
# (run csindex yourself, e.g. from cron).
update_interval: 10m

# Where to POST (as JSON) new matches of monitored saved searches.
# monitor_webhook: https://hooks.slack.com/services/...

# Rank recently modified files slightly higher in search results.
# rank_recent: true

# Files larger than this are not indexed (generated or data files, mostly).
max_file_size: 2MB

# Large repositories are split into shards of about this many files, so an
# incremental update only rewrites the shards that changed and searches
# run in parallel. The default suits trees from small to AOSP-sized.
# shard_files: 25000

# Number of shards indexed concurrently (each needs ~400 MB of memory).
# Default: half the CPUs, at most 4.
# parallelism: 4

# Glob patterns excluded from every repository, in addition to the
# built-in defaults (binaries, images, archives, node_modules, ...;
# set use_default_excludes: false to turn those off). Hidden files and
# directories (.git, .repo, ...) are always skipped unless include_hidden
# is true.
#
#   name       a file or directory with this name anywhere ("*.min.js" too)
#   /out       only the top-level "out" directory (patterns with a slash
#              match the path from the repository root)
#
# Files ignored by .gitignore (and .git/info/exclude) are skipped too;
# set use_gitignore: false to index them.
# use_gitignore: true
exclude:
  - "*.log"
  - "*.lock"
  - "package-lock.json"

# The folders to index. name defaults to the folder's base name and is
# what you use in repo: queries.
repos:
  - path: ~/src/myproject

  - name: aosp
    path: ~/aosp
    exclude:
      - /out              # build output
      - /prebuilts        # binary toolchains and SDKs
      - /external/chromium-webview
      - "*.apk"

  # - name: linux
  #   path: ~/src/linux
